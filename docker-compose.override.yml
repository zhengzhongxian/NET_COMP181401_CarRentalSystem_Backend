version: "3.8"

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: renticar-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - renticar-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis/redis-stack:latest
    container_name: renticar-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - renticar-network
    restart: unless-stopped
  
  # RabbitMQ
  rabbitmq:
    image: masstransit/rabbitmq:latest
    container_name: renticar-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=blacksun
      - RABBITMQ_DEFAULT_PASS=vagabond
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - renticar-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: renticar-minio
    environment:
      - MINIO_ROOT_USER=vagabond
      - MINIO_ROOT_PASSWORD=blacksun
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - renticar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # .NET API Application
  api:
    build:
      context: .
      dockerfile: NET_CarRentalSystem/Dockerfile
    container_name: renticar-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "1610:80"
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./Models:/app/Models:ro
      - ./logs:/app/Logs
      - ./NET_CarRentalSystem/appsettings.Development.json:/app/appsettings.Development.json:ro
    networks:
      - renticar-network
    restart: unless-stopped

  # .NET Sync Service
  syncdatatool:
    build:
      context: .
      dockerfile: NET_CarRentalSystem.SyncDataTool/Dockerfile
    container_name: renticar-syncdatatool
    environment:
      - DOTNET_ENVIRONMENT=Development
    depends_on:
      - sqlserver
      - api
    networks:
      - renticar-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  rabbitmqdata:
    driver: local
  minio_data:
    driver: local

networks:
  renticar-network:
    external: true
    name: api-gateway_renticar-network