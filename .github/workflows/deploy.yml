name: Deploy Renticar

on:
  push:
    branches: [ "main", "test", "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NET_CarRentalSystem/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/renticar-api:${{ vars.ASPNETCORE_ENVIRONMENT }}

      - name: Build and Push SyncTool
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NET_CarRentalSystem.SyncDataTool/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/renticar-sync:${{ vars.ASPNETCORE_ENVIRONMENT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          API_CONFIG: ${{ secrets.APPSETTINGS_API_JSON }}
          SYNC_CONFIG: ${{ secrets.APPSETTINGS_SYNC_JSON }}
          PROJECT_PATH: ${{ vars.VPS_PROJECT_PATH }}
          ENV_NAME: ${{ vars.ASPNETCORE_ENVIRONMENT }}
          GITHUB_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: ENV_CONTENT,API_CONFIG,SYNC_CONFIG,PROJECT_PATH,ENV_NAME,GITHUB_REF,GH_TOKEN,GH_USER,GH_OWNER
          script: |
            GH_OWNER_LOWER=$(echo "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
            
            echo "=== DEPLOYING TO $ENV_NAME ==="
            
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

            if [ -d "$PROJECT_PATH" ]; then
              cd "$PROJECT_PATH"
              docker compose down || true
              cd ..
              rm -rf "$PROJECT_PATH"
              mkdir -p "$PROJECT_PATH"
            else
              mkdir -p "$PROJECT_PATH"
            fi
            
            git clone ${{ secrets.REPO_URL }} "$PROJECT_PATH"
            cd "$PROJECT_PATH"
            git checkout "$GITHUB_REF"

            echo "$ENV_CONTENT" > .env
            echo "$API_CONFIG" > "./NET_CarRentalSystem/appsettings.${ENV_NAME}.json"
            echo "$SYNC_CONFIG" > "./NET_CarRentalSystem.SyncDataTool/appsettings.${ENV_NAME}.json"
            
            export GITHUB_REPOSITORY_OWNER=$GH_OWNER_LOWER
            export ASPNETCORE_ENVIRONMENT=$ENV_NAME

            docker compose pull
            docker compose --env-file .env up -d --force-recreate
            docker image prune -f
            
            echo "=== DEPLOY SUCCESS ==="