version: "3.8"

services:
  # 1. SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: renticar-sqlserver-${ASPNETCORE_ENVIRONMENT}
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    restart: always
    ports:
      - "${SQL_PORT}:1433"
    volumes:
      - ./sqlserver_data_${ASPNETCORE_ENVIRONMENT}:/var/opt/mssql
    networks:
      - renticar-network

  # 2. Redis
  redis:
    image: redis/redis-stack:latest
    container_name: renticar-redis-${ASPNETCORE_ENVIRONMENT}
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis_data_${ASPNETCORE_ENVIRONMENT}:/data
    networks:
      - renticar-network

  # 3. RabbitMQ
  rabbitmq:
    image: masstransit/rabbitmq:latest
    container_name: renticar-rabbitmq-${ASPNETCORE_ENVIRONMENT}
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_ADMIN_PORT}:15672"
    volumes:
      - ./rabbitmq_data_${ASPNETCORE_ENVIRONMENT}:/var/lib/rabbitmq
    networks:
      - renticar-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # 4. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: renticar-minio-${ASPNETCORE_ENVIRONMENT}
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./minio_data_${ASPNETCORE_ENVIRONMENT}:/data
    command: server /data --console-address ":9001"
    networks:
      - renticar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 5. .NET API
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/renticar-api:${ASPNETCORE_ENVIRONMENT}
    container_name: renticar-api-${ASPNETCORE_ENVIRONMENT}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
    env_file:
      - .env
    ports:
      - "${API_HTTP_PORT}:80"
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./https:/https:ro
      - ./logs:/app/Logs
      - ./appsettings.${ASPNETCORE_ENVIRONMENT}.json:/app/appsettings.${ASPNETCORE_ENVIRONMENT}.json
      - ./Models:/app/Models:ro
    networks:
      - renticar-network

  # 6. Sync Tool
  syncdatatool:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/renticar-sync:${ASPNETCORE_ENVIRONMENT}
    container_name: renticar-syncdatatool-${ASPNETCORE_ENVIRONMENT}
    restart: always
    environment:
      - DOTNET_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      - sqlserver
      - api
    volumes:
      - ./logs:/app/Logs
      - ./appsettings.${ASPNETCORE_ENVIRONMENT}.sync.json:/app/appsettings.${ASPNETCORE_ENVIRONMENT}.json
    networks:
      - renticar-network
  # 7. Elasticsearch (Audit Logs)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: renticar-elasticsearch-${ASPNETCORE_ENVIRONMENT}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    restart: always
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - ./elasticsearch_data_${ASPNETCORE_ENVIRONMENT}:/usr/share/elasticsearch/data
    networks:
      - renticar-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 8. Kibana (Log Dashboard)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: renticar-kibana-${ASPNETCORE_ENVIRONMENT}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: always
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - renticar-network

volumes:
  sqlserver_data_Production:
  sqlserver_data_Test:
  sqlserver_data_Development:
  redis_data_Production:
  redis_data_Test:
  redis_data_Development:
  rabbitmq_data_Production:
  rabbitmq_data_Test:
  rabbitmq_data_Development:
  minio_data_Production:
  minio_data_Test:
  minio_data_Development:
  elasticsearch_data_Production:
  elasticsearch_data_Test:
  elasticsearch_data_Development:


networks:
  renticar-network:
    external: true
    name: api-gateway_renticar-network